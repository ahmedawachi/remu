name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # eframe/wgpu and the X11 input backend need these; the other two
      # platforms get their equivalents from the OS SDK.
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libxrandr-dev libxi-dev libxtst-dev \
            libgtk-3-dev libxkbcommon-dev libssl-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Snapshot tests need a GPU adapter, which the hosted runners do not
      # have, so they are excluded here and run locally before a release.
      - name: Test
        run: cargo test --workspace --exclude remu-desk

      - name: Test the desk crate (no rendering)
        run: cargo test -p remu-desk --lib

      - name: Build
        run: cargo build --workspace --release
