name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Deliberately NOT setting RUSTFLAGS: -D warnings here. It applies to
  # dependencies as well as to our own crates, so a warning in anything we
  # merely depend on fails the build. Warnings are denied per-invocation on the
  # clippy step instead, which is the only place we control the code.

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # No toolchain action: `rust-toolchain.toml` pins the exact version and
      # its components, and rustup honours it automatically. That keeps CI on
      # the same compiler as a developer's machine, so a lint added by a new
      # stable release cannot turn the build red without anyone changing code.
      - name: Show toolchain
        run: |
          rustup show active-toolchain
          cargo --version
          cargo clippy --version

      - uses: Swatinem/rust-cache@v2

      # wgpu/winit need X11 and Wayland headers; scap's PipeWire backend needs
      # libpipewire plus libclang, because libspa-sys generates its bindings
      # with bindgen at build time.
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb1-dev libxrandr-dev libxi-dev libxtst-dev \
            libgtk-3-dev libxkbcommon-dev libssl-dev \
            libpipewire-0.3-dev libspa-0.2-dev clang libclang-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The desk crate's integration tests render through wgpu and need a GPU
      # adapter, which the hosted runners do not have. Its unit tests run below;
      # the snapshot and end-to-end suites run locally before a release.
      - name: Test
        run: cargo test --workspace --exclude remu-desk

      - name: Test the desk crate
        run: cargo test -p remu-desk --lib

      - name: Build
        run: cargo build --workspace --release
